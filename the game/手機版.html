<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>星辰之路</title>
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 430px;
            max-height: 932px;
            background-color: #000;
            overflow: hidden;
            touch-action: manipulation;
        }

        @media (min-width: 500px) and (min-height: 500px) {
            #game-container {
                border-radius: 20px;
                border: 2px solid #333;
                height: 90vh;
            }
        }

        /* ------------------------------------------
           📱 1. 載入畫面
           ------------------------------------------ */
        #loading-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            font-weight: bold;
            font-size: 20px;
            color: #ffffff;
            background: #0f0f0f;
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center;
            gap: 15px;
            z-index: 999999;
        }

        .progress-container {
            width: 70%;
            max-width: 250px;
            background: #222;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #progress-bar {
            height: 12px;
            background: #62c6ff;
            width: 0%;
            transition: width 0.3s;
        }

        /* ------------------------------------------
           🖼️ 2. 舞台與角色立繪
           ------------------------------------------ */
        #page1 {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 100;
        }

        .背景圖 img, .背景 img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .背景圖, .背景 {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        .角色圖 {
            z-index: 10;
        }

        .角色圖 img {
            filter: drop-shadow(0 0 3px #fff) drop-shadow(0 0 4px rgba(255, 255, 255, 0.8));
        }

        .全星辰 {
            z-index: 5;
            width: 80%;
            position: absolute;
            right: 20%;
            bottom: 10px;
            display: none;
        }

        .全星辰 img { width: 160%; height: auto; }

        #星辰思考 {
            width: 70%;
            /* right: -5%; */
            bottom: 70px;
        }

        .全好奇星 {
            position: absolute;
            left: -12%;
            bottom: 180px;
            width: 75%;
        }

        .全好奇星 img { width: 135%; height: auto; }

        .全同情星 {
            position: absolute;
            left: -5%;
            bottom: 150px;
            width: 70%;
        }

        .全同情星 img { width: 100%; height: auto; }

        /* 🎭 角色動態特效 */
        .slide-in-right { animation: slideInFromRight 0.4s ease-out forwards; }
        @keyframes slideInFromRight {
            0% { transform: translateX(30px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }

        .scared-bounce { animation: scareJump 0.4s ease-out; }
        @keyframes scareJump {
            0%, 100% { transform: translateY(0) scale(1); }
            30% { transform: translateY(-25px) scale(0.95, 1.05); }
            60% { transform: translateY(0) scale(1.05, 0.95); }
        }

        .curious-pop { animation: curiousPop 0.35s ease-out both !important; }
        @keyframes curiousPop {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(0.98, 1.05); }
        }

        .curious-bounce { animation: curiousBounce 0.5s ease-out both !important; }
        @keyframes curiousBounce {
            0%, 100% { transform: translateY(0); }
            30% { transform: translateY(-20px); }
            60% { transform: translateY(-8px); }
        }

        .curious-wiggle { animation: curiousWiggle 0.5s ease-in-out both !important; }
        @keyframes curiousWiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-6deg); }
            75% { transform: rotate(6deg); }
        }

        .nod-head { animation: headNod 0.4s ease-in-out; }
        @keyframes headNod {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(10px); }
        }

        /* ------------------------------------------
   💬 3. 對話框與名字（外框共用底色融合）
   ------------------------------------------ */

/* 1. 包裹容器：定位整個對話框區域，並統一施加黑色外邊緣濾鏡 */
.dialog-wrapper {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 35%;
    z-index: 999;
    pointer-events: none;
    /* 💡 已完全移除 filter: drop-shadow(...) */
}

.dialog-wrapper * {
    pointer-events: auto; /* 恢復子元素的點擊事件 */
}

/* 2. 對話框本體 */
#對話框 {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 85%;
    /* 💡 將 0.95 改為 0.7（代表 70% 不透明度 / 30% 半透明），可依喜好微調 */
    background: linear-gradient(
        to bottom, 
        rgba(0, 0, 0, 0.95) 0%,   /* 頂部深灰色（85% 不透明） */
        rgba(15, 15, 15, 0.85) 100%     /* 底部極深黑（95% 不透明） */
    );
    
    clip-path: polygon(0% 0%, 100% 15%, 100% 100%, 0% 100%);
    z-index: 1;
}

#對話框.hide-dialog {
    display: none !important;
}
#player-text.hide-dialog {
    display: none !important;
}
#對話框那條線 {
    position: absolute;
    top: 240px;
    left: 0;
    width: 100%;
    height: 20px;
    background-color: #ffb30f;
    z-index: 2;
}

/* 3. SVG 名字定位：放在對話框左上方，與對話框交界融合 */
.player-svg {
    position: absolute;
    top: 40px !important;
    left: 20px;
    width: 300px;
    height: 70px;
    z-index: 3;           /* 名字蓋在對話框上方 */
}

/* 4. 名字文字樣式（移除獨立描邊，由外層 drop-shadow 統一處理） */
.player-text {
    font-size: 50px;
    font-family: 'Dela Gothic One', Arial, sans-serif;
    display: none;        /* 預設隱藏 */
    /* 💡 增加黑色描邊與控制粗細 */
    stroke: #0f0f0f;   
    stroke-width: 20px;       /* 💡 描邊粗細：數值越大越粗（如 6px, 8px, 10px, 12px） */
    paint-order: stroke fill;/* 確保描邊在底下，不壓到文字顏色 */
    stroke-linejoin: round;  /* 讓描邊轉角變圓滑 */
    stroke-linecap: round;   /* 讓描邊端點變圓滑 */

    display: none;           /* 預設隱藏 */
}


/* 角色顏色設定 */
.name-star { fill: #ffab0f; }
.name-curious { fill: #88fdf8; }
.name-curious-random-person { fill: #88fdf8; }
.name-curious-group { fill: #88fdf8; }
.name-refreshing { fill: #ff8b8b; }
.name-sympathy { fill: #f2aeff; }
.name-passionate { fill: #c3ff9b; }

/* 5. 顯示與角色名稱匹配 */
#page1.speaker-star .name-star { display: block !important; }
#page1.speaker-curious .name-curious { display: block !important; }
#page1.speaker-curious-random-person .name-curious-random-person { display: block !important; }
#page1.speaker-curious-group .name-curious-group { display: block !important; }
#page1.speaker-refreshing .name-refreshing { display: block !important; }
#page1.speaker-sympathy .name-sympathy { display: block !important; }
#page1.speaker-passion .name-passionate { display: block !important; }


        #對話文本 {

}

    * {
        user-select: none;

    /* 2. 選項按鈕樣式 */
    .選項按鈕 {
        width: 90%;
        height: 55px;
        background-color: #232323;

        color: white;
        cursor: pointer;
        font-size: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;

        z-index: 1000;
        /* 字型名稱必須與 @font-face 宣告的名稱完全一致 */
        font-family: 'CP-&-TRANS', sans-serif !important;
    }
        .選項按鈕.small-text {
            font-size: 14px;
        }

        .選項按鈕:active {
            transform: scale(0.98);
        }

        /* ------------------------------------------
           🛠️ 5. 選單與問名字彈窗
           ------------------------------------------ */
        .menu-container {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 200000;
        }

        #burger-menu {
            width: 46px;
            height: 46px;
            cursor: pointer;
            display: flex;
            align-items: center;      
            justify-content: center;  
            background-color: rgba(0, 0, 0, 0.6); 
            border-radius: 12px; 
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        #burger-menu img { width: 26px; height: auto; }

        #menu-items-wrapper {
            display: flex;
            gap: 8px;
            overflow: hidden;
            max-width: 0; 
            transition: max-width 0.4s ease-in-out;
            white-space: nowrap;
            align-items: center;
        }

        #menu-items-wrapper.open { max-width: 250px; }

        .nav-item {
            background-color: rgba(0, 0, 0, 0.7); 
            color: white;
            width: 42px;
            height: 42px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            opacity: 0;
            transform: translateX(-10px);
            transition: all 0.2s ease;
            border: 1.5px solid #444;
        }

        #menu-items-wrapper.open .nav-item { opacity: 1; transform: translateX(0); }
        .nav-item img { width: 20px; height: auto; }
        .nav-item.active { background-color: #ffa033; border-color: #ffffff; }

        /* 問名字彈窗 */
        #問名字 {
            display: none;
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 999998;
        }

        #askname-item {
            display: none;
            position: absolute;
            top: 45%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 999999;
            width: 85%;
            max-width: 320px;
            padding: 20px;
            background: #222222;
            border: 3px solid #ffb921;
            border-radius: 16px;
            text-align: center;
        }

        #askname-item.show { display: block; }

        .ask-title { color: #ffffff; font-size: 18px; font-weight: bold; margin: 0 0 15px 0; }
        .ask-row { display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 8px; width: 100%; }
        .ask-input { height: 42px; flex: 1; min-width: 0; padding: 0 10px; font-size: 16px; font-weight: bold; text-align: center; border-radius: 8px; border: 1px solid #666; background: #fff; color: #000; }
        .ask-btn { height: 42px; padding: 0 16px; font-size: 16px; font-weight: bold; cursor: pointer; background-color: #ffd561; color: #222; border: none; border-radius: 8px; }

    </style>
</head>

        let loadedCount = 0;
        const totalCritical = criticalAssets.length;

        function preloadImages(array, callback) {
            if (!array || array.length === 0) return callback();
            array.forEach(src => {
                const img = new Image();
                img.src = src;
                img.onload = () => handleAssetLoaded(callback);
                img.onerror = () => handleAssetLoaded(callback);
            });
        }

        function handleAssetLoaded(callback) {
            loadedCount++;
            let percent = Math.floor((loadedCount / totalCritical) * 100);
            const bar = document.getElementById('progress-bar');
            const text = document.getElementById('loading-percent');
            if (bar) bar.style.width = percent + "%";
            if (text) text.innerText = percent + "%";
            if (loadedCount >= totalCritical && typeof callback === "function") {
                callback();
            }
        }

        function enterGameAnimation() {
            const loadingScreen = document.getElementById('loading-screen');
            if (loadingScreen) {
                loadingScreen.style.opacity = '0';
                setTimeout(() => { loadingScreen.style.display = 'none'; }, 800);
            }
        }

        function toggleMenu(e) {
            if (e) e.stopPropagation();
            const wrapper = document.getElementById("menu-items-wrapper");
            if (wrapper) wrapper.classList.toggle("open");
        }

        function startTypingEffect(text, callback) {
            const textTag = document.getElementById("對話文本");
            if (!textTag) return;

            if (window.myTypingTimer) {
                clearInterval(window.myTypingTimer);
                window.myTypingTimer = null;
            }

            let formattedText = (text || "")
                .replace(/\{playerName\}/g, window.playerName || "")
                .replace(/\(玩家名稱\)/g, window.playerName || "")
                .replace(/（玩家名稱）/g, window.playerName || "");

            window.currentFullText = formattedText;
            window.isTyping = true;
            textTag.innerHTML = ""; 

            let index = 0;
            window.myTypingTimer = setInterval(() => {
                if (!window.isTyping) {
                    clearInterval(window.myTypingTimer);
                    window.myTypingTimer = null;
                    return;
                }

                if (index < formattedText.length) {
                    textTag.innerHTML += formattedText.charAt(index);
                    index++;
                } else {
                    clearInterval(window.myTypingTimer);
                    window.myTypingTimer = null;
                    window.isTyping = false;
                    if (typeof callback === "function") callback();
                }
            }, 30);
        }

        function renderOptions(scene) {
            const optBox = document.getElementById('選項框');
            if (scene && scene.options && optBox) {
                optBox.innerHTML = "";
                optBox.style.display = 'flex';

                scene.options.forEach(opt => {
                    const btn = document.createElement('div');
                    btn.innerText = opt.text;
                    btn.className = '選項按鈕';

                    if (Number(scene.id) === 60) {
                        btn.classList.add('small-text');
                    }

                    btn.onclick = (e) => {
                        e.stopPropagation();
                        selectOption(opt, scene);
                    };
                    optBox.appendChild(btn);
                });
            }
        }

        function renderScene(stepIndex) {
            const scene = storyScript[stepIndex];
            if (!scene) return;

            const dialogBox = document.getElementById('對話框');
            const hasText = scene.text && scene.text.trim() !== "";

            if (dialogBox) {
                if (!hasText) dialogBox.classList.add('hide-dialog');
                else dialogBox.classList.remove('hide-dialog');
            }

            if (window.myTypingTimer) {
                clearInterval(window.myTypingTimer);
                window.myTypingTimer = null;
            }
            window.isTyping = false;
            
            const pageEl = document.getElementById('page1');
            const currentSceneId = Number(scene.id);

            if (scene.background) {
                document.querySelectorAll('.背景圖, .背景').forEach(el => el.style.display = 'none');
                const targetBg = document.getElementById(scene.background);
                if (targetBg) targetBg.style.display = 'block';
            }

            let displayName = "";
            if (scene.speaker) {
                displayName = (scene.speaker === "玩家") ? (window.playerName ? `${window.playerName} ・ 星辰` : "星辰") : scene.speaker;
            } else if (scene.characters && scene.characters.length > 0) {
                let charName = scene.characters[0];
                if (charName.includes("路人好奇星")) displayName = "路人好奇星";
                else if (charName.includes("一群好奇星")) displayName = "好奇星們";
                else if (charName.includes("星辰")) displayName = (currentSceneId < 8) ? "星辰" : (window.playerName ? `${window.playerName} ・ 星辰` : "星辰");
                else if (charName.includes("好奇星")) displayName = "好奇星";
                else if (charName.includes("同情星")) displayName = "同情星";
                else if (charName.includes("熱情星")) displayName = "熱情星";
                else if (charName.includes("爽快星")) displayName = "爽快星";
                else displayName = charName;
            }

            if (pageEl) {
                pageEl.classList.remove('speaker-star', 'speaker-curious', 'speaker-curious-random-person', 'speaker-curious-group', 'speaker-sympathy', 'speaker-passion', 'speaker-refreshing');
                if (displayName.includes("路人好奇星")) pageEl.classList.add('speaker-curious-random-person');
                else if (displayName.includes("好奇星們")) pageEl.classList.add('speaker-curious-group');
                else if (displayName.includes("星辰") || scene.speaker === "玩家") pageEl.classList.add('speaker-star');
                else if (displayName.includes("好奇星")) pageEl.classList.add('speaker-curious');
                else if (displayName.includes("同情星")) pageEl.classList.add('speaker-sympathy');
                else if (displayName.includes("熱情星")) pageEl.classList.add('speaker-passion');
                else if (displayName.includes("爽快星")) pageEl.classList.add('speaker-refreshing');
                else pageEl.classList.add('speaker-star');
            }

            if (currentSceneId === 8) showInputBox();
            else hideInputBox();

            const optBox = document.getElementById('選項框');
            if (optBox) optBox.style.display = 'none';

            hideAllCharacters();
            if (scene.characters && Array.isArray(scene.characters)) {
                scene.characters.forEach(charName => {
                    const charEl = document.getElementById(charName);
                    if (charEl) charEl.style.display = 'block';
                });
            }

            switch (currentSceneId) {
                case 0: case 1: playScaredAnim("星辰害怕"); break;
                case 1.5: case 3: case 26: playScaredAnim("星辰嚇死"); break;
                case 2.1: case 2.2: case 2.3: case 2.4: case 14: playSlideInAnim("星辰"); break;
                case 39: case 37: playNodAnim("星辰驕傲"); break;
                case 12: case 100: case 134: playNodAnim("星辰點頭"); break;
                case 30: playHappyJumpAnim("一群好奇星"); break;
                case 5: playCuriousAnim("好奇星", "curious-bounce"); break;
                case 7: playCuriousAnim("好奇星開心", "curious-wiggle"); break;
                case 19: playCuriousAnim("好奇星會跳", "curious-pop"); break;
                case 40: playCuriousAnim("好奇星有尾巴", "curious-bounce"); break;
                case 41: playCuriousAnim("好奇星開心有尾巴", "curious-wiggle"); break;
            }

            startTypingEffect(scene.text, () => {
                renderOptions(scene);
            });
        }

        function selectOption(option, currentScene) {
            if (option.score && !scoredSceneIds.has(currentScene.id)) {
                for (let character in option.score) {
                    scores[character] = (scores[character] || 0) + option.score[character];
                }
                scoredSceneIds.add(currentScene.id);
            }

            const nextIndex = storyScript.findIndex(s => s.id === option.nextId);
            if (nextIndex !== -1) {
                currentStep = nextIndex;
                renderScene(currentStep);
            }
        }

        function nextStep() {
            const scene = storyScript[currentStep];
            if (scene && Number(scene.id) === 8) return;

            if (window.isTyping) {
                if (window.myTypingTimer) {
                    clearInterval(window.myTypingTimer);
                    window.myTypingTimer = null;
                }
                window.isTyping = false;
                const textBox = document.getElementById("對話文本");
                if (textBox) textBox.innerHTML = window.currentFullText;
                renderOptions(scene);
                return;
            }

            if (scene && scene.options && scene.options.length > 0) return;

            if (scene && scene.nextId !== undefined) {
                currentStep = storyScript.findIndex(s => s.id === scene.nextId);
            } else {
                currentStep++;
            }

            if (currentStep < storyScript.length && currentStep !== -1) {
                renderScene(currentStep);
            }
        }

        document.addEventListener('click', function (e) {
            const menuContainer = document.querySelector('.menu-container');
            const wrapper = document.getElementById("menu-items-wrapper");
            if (menuContainer && !menuContainer.contains(e.target) && wrapper) {
                wrapper.classList.remove('open');
            }

            if (e.target.closest('.menu-container') || 
                e.target.closest('.選項按鈕') || 
                e.target.closest('#player-name-input') ||
                e.target.closest('.nav-item') ||
                e.target.closest('#askname-item')) {
                return; 
            }

            nextStep();
        });

        function showInputBox() {
            const askBg = document.getElementById("問名字");
            if (askBg) askBg.style.display = "block";
            const askItem = document.getElementById("askname-item");
            if (askItem) askItem.classList.add("show");
            setTimeout(() => {
                const input = document.getElementById("player-name-input");
                if (input) input.focus();
            }, 150);
        }

        function hideInputBox() {
            const askBg = document.getElementById("問名字");
            if (askBg) askBg.style.display = "none";
            const askItem = document.getElementById("askname-item");
            if (askItem) askItem.classList.remove("show");
        }

        function submitName() {
            const inputEl = document.getElementById("player-name-input");
            let inputName = inputEl ? inputEl.value.trim() : "";
            window.playerName = inputName || "星辰";
            hideInputBox();
            const targetIndex = storyScript.findIndex(s => Number(s.id) === 9);
            if (targetIndex !== -1) {
                currentStep = targetIndex;
                renderScene(currentStep);
            } else {
                currentStep++;
                renderScene(currentStep);
            }
        }

        function hideAllCharacters() {
            const chars = [
                "星辰", "星辰害怕", "星辰嚇死", "星辰點頭", "星辰微笑", "星辰思考", "星辰苦惱", "星辰感動", "好奇星", 
                "同情星","同情星苦惱","同情星感動", "爽快星", "熱情星", "星辰驕傲", "好奇星開心", 
                "好奇星有尾巴", "好奇星會跳", "好奇星開心有尾巴", "路人好奇星張嘴", "路人好奇星閉嘴", "好奇星哭",
                "同情星自信","一群好奇星","好奇星哭小尾巴","好奇星開心閉眼"
            ];
            chars.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.style.display = 'none';
            });
        }

        function playHappyJumpAnim(charId) {
            const target = document.getElementById(charId);
            if (target) {
                target.classList.remove('curious-pop'); 
                void target.offsetWidth; 
                target.classList.add('curious-pop');    
            }
        }

        function playSlideInAnim(charId) {
            const target = document.getElementById(charId);
            if (target) {
                target.classList.remove('slide-in-right'); 
                void target.offsetWidth; 
                target.classList.add('slide-in-right');    
            }
        }

        function playScaredAnim(charId) {
            const target = document.getElementById(charId);
            if (target) {
                target.classList.remove('scared-bounce'); 
                void target.offsetWidth; 
                target.classList.add('scared-bounce');    
            }
        }

        function playCuriousAnim(charId, animType = 'curious-bounce') {
            const target = document.getElementById(charId);
            if (!target) return;
            target.classList.remove('curious-bounce', 'curious-wiggle', 'curious-pop', 'nod-head'); 
            void target.offsetWidth; 
            target.classList.add(animType); 
        }

        function playNodAnim(charId) {
            hideAllCharacters();
            const target = document.getElementById(charId);
            if (!target) return;
            target.style.display = 'block'; 
            target.classList.remove('nod-head');
            void target.offsetWidth; 
            target.classList.add('nod-head');
        }

        function toggleActive(element) {
            if (element) element.classList.toggle('active');
        }

        window.addEventListener('DOMContentLoaded', () => {
            hideAllCharacters();
            preloadImages(criticalAssets, () => {
                enterGameAnimation();
                renderScene(0);
            });
        });
    </script>
</body>
</html>
